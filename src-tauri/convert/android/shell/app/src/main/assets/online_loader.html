<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>__APP_NAME__</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
        }
        #player-container {
            width: 100%;
            height: 100%;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div class="loading">正在加载作品...</div>
    </div>
    
    <script>
        // Online work URL - will be replaced during packaging
        const WORK_URL = '__ONLINE_WORK_URL__';
        
        if (WORK_URL && WORK_URL !== '__ONLINE_WORK_URL__') {
            // Redirect to online player
            window.location.href = WORK_URL;
        } else {
            document.querySelector('.loading').textContent = '作品信息加载失败';
        }
    </script>
</body>
</html>
